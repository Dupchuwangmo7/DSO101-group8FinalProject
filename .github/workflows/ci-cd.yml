name: CI/CD Pipeline

# ============================================================
# Trigger Configuration
# ============================================================
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: dupchuuw
  FRONTEND_IMAGE: dupchuuw/final-project-frontend
  BACKEND_IMAGE: dupchuuw/final-project-backend

# ============================================================
# Jobs
# ============================================================
jobs:
  # ============================================================
  # Lint and Test
  # ============================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ============================================================
      # Backend Testing
      # ============================================================
      - name: Setup Node.js for backend
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint backend code
        working-directory: ./backend
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run backend tests
        working-directory: ./backend
        run: npm test --if-present
        continue-on-error: true
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          JWT_SECRET: test-secret

      # ============================================================
      # Frontend Testing
      # ============================================================
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: ./frontend
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          # Falls back to empty string if secret not set — Vite will use the
          # default defined in vite.config.js or leave it undefined (OK for CI)
          VITE_API_URL: ${{ secrets.API_URL || '' }}

  # ============================================================
  # Build Docker Images
  # ============================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ── Backend Image ────────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend          # backend Dockerfile uses relative paths inside /backend ✅
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      # ── Frontend Image ───────────────────────────────────────
      # FIX: context must be repo ROOT (.) because frontend/Dockerfile references
      #      "frontend/package*.json", "frontend/src", and "nginx/default.conf"
      #      — all of which only exist relative to the repo root, not ./frontend.
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .                  # ← was "./frontend" — that broke the build ✅
          file: ./frontend/Dockerfile # explicitly point to the Dockerfile location
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.API_URL }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

      - name: Output image tags
        run: |
          echo "✅ Docker images built and pushed successfully!"
          echo "Backend:  ${{ env.BACKEND_IMAGE }}:latest"
          echo "Frontend: ${{ env.FRONTEND_IMAGE }}:latest"

  # ============================================================
  # Security Scan (runs in parallel with build-images)
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'node_modules,dist,build,.git'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================
  # Deploy to Production (trigger Render deploy hooks)
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render backend deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -s -o /dev/null -w "%{http_code}" --request POST "$HOOK_URL" \
            | grep -q "^2" && echo "✅ Backend deploy triggered" || echo "❌ Backend deploy hook failed"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_BACKEND secret not set, skipping"
          fi

      - name: Trigger Render frontend deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -s -o /dev/null -w "%{http_code}" --request POST "$HOOK_URL" \
            | grep -q "^2" && echo "✅ Frontend deploy triggered" || echo "❌ Frontend deploy hook failed"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_FRONTEND secret not set, skipping"
          fi

      - name: Deploy summary
        run: |
          echo "🚀 Deployment triggered for commit ${{ github.sha }}"
          echo "Images deployed:"
          echo "  ${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          echo "  ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"

  # ============================================================
  # Notify on Failure
  # ============================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-images, deploy]
    if: failure()

    steps:
      - name: Send notification
        run: |
          echo "❌ CI/CD pipeline failed!"
          echo "Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"