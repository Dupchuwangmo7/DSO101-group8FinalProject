version: '3.8'

# ============================================================
# Semzung - Mental Health Support Platform
# Docker Compose Configuration
# 
# This file orchestrates:
# - Frontend (React + Nginx)
# - Backend (Node.js + Express)
# - MongoDB (Cloud instance via connection string)
# 
# DevOps Best Practices:
# - Environment variable management
# - Health checks
# - Volume persistence
# - Network isolation
# - Restart policies
# ============================================================

services:
  # ============================================================
  # Frontend Service
  # React app served by Nginx with reverse proxy
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5002}
    depends_on:
      - backend
    networks:
      - semzung-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "com.semzung.service=frontend"
      - "com.semzung.description=React Frontend Application"

  # ============================================================
  # Backend Service
  # Node.js + Express API server
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      # Server Configuration
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5002

      # Database Configuration
      - MONGODB_URI=${MONGODB_URI}

      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE:-7d}

      # Frontend URL for CORS
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}

      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}

      # Optional: Cloudinary for image uploads
      - CLOUDINARY_NAME=${CLOUDINARY_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}

      # Optional: Email service
      - EMAIL_SERVICE=${EMAIL_SERVICE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}

    networks:
      - semzung-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "com.semzung.service=backend"
      - "com.semzung.description=Node.js Backend API"

  # ============================================================
  # Optional: Nginx Reverse Proxy (for advanced setups)
  # Uncomment to use Nginx as main reverse proxy
  # ============================================================
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/certs:/etc/nginx/certs:ro
  #   networks:
  #     - semzung-network
  #   depends_on:
  #     - frontend
  #     - backend
  #   restart: unless-stopped

networks:
  # Create isolated network for services
  semzung-network:
    driver: bridge

# ============================================================
# DEPLOYMENT NOTES
# ============================================================
#
# LOCAL DEVELOPMENT:
#   docker-compose up --build
#
# PRODUCTION:
#   docker-compose -f docker-compose.yml up -d --build
#
# ENVIRONMENT VARIABLES:
#   Create .env file with required variables (see .env.example)
#
# DATABASE:
#   Uses MongoDB Atlas (cloud). Set MONGODB_URI in .env
#
# SCALING:
#   docker-compose up --build -d --scale backend=3
#
# HEALTH CHECKS:
#   Services include health checks for monitoring
#
# LOGS:
#   docker-compose logs -f
#   docker-compose logs -f backend
#
# CLEANUP:
#   docker-compose down -v (removes volumes)
#   docker-compose down (keeps volumes)
#
# ============================================================
